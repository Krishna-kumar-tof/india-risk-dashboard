name: Validate

# Catches a broken daily brief on the pull request rather than on the
# live site.
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate data
        run: node scripts/validate-intel.mjs

      - name: Build
        run: npm run build
