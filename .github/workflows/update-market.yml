name: Update Market Data

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours UTC
  workflow_dispatch:

# CRITICAL — without this, GITHUB_TOKEN cannot push commits
permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market data and update JSON
        run: node scripts/fetch-market-data.mjs

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes before pushing
        run: git pull origin main --rebase

      - name: Commit and push if changed
        run: |
          git add public/market-data.json
          if git diff --staged --quiet; then
            echo "No changes to market-data.json — skipping commit"
          else
            git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
