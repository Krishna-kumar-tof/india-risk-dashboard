name: Update Market Data

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 9 * * *'   # 3:00 PM IST
  workflow_dispatch:

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch market data and update JSON
        run: python scripts/fetch_market_data.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes before pushing
        run: |
          git pull origin main --rebase

      - name: Commit and push if changed
        run: |
          git add public/market-data.json
          git diff --staged --quiet || git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
